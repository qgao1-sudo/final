<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Stories - Interactive 3D Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 30px;
            border-radius: 15px;
            z-index: 100;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }

        #instructions h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #instructions p {
            font-size: 14px;
            margin: 5px 0;
        }

        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            z-index: 10;
            display: none;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        #hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 10;
        }

        .loading {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            z-index: 101;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }

        #wedding-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background: black;
            display: none;
        }

        #wedding-video video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #close-video {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1001;
        }

        #close-video:hover {
            background: rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="instructions">
        <h2>🏝️ Stone Stories</h2>
        <p>Hover your mouse over stones to interact</p>
    </div>
    <div id="timer"></div>
    <div id="hint"></div>
    <div class="loading" id="loading">Loading...</div>

    <!-- Wedding Video Player -->
    <div id="wedding-video">
        <button id="close-video">Close ✕</button>
        <video id="video-player" autoplay>
            <source src="结婚1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- TWEEN.js for camera animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        // Game State
        const GameState = {
            BEACH: 'beach',
            STORY: 'story'
        };

        let currentState = GameState.BEACH;
        let scene, camera, renderer;
        let stones = [];
        let selectedStone = null;
        let particles = null;
        let expansionTimer = 0;
        let isExpanding = false;
        let targetExpansionTime = 5.0;

        // Mouse interaction
        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let mousePressed = false;

        // Hover detection
        let hoveredStone = null;
        let hoverTimer = 0;
        let hoverDuration = 2.0; // 2 seconds

        // Camera animation
        let cameraAnimating = false;
        let originalCameraPosition = { x: 0, y: 5, z: 15 };
        let originalCameraTarget = { x: 0, y: 0, z: 0 };

        // Stone colors
        const stoneColors = [
            0xff6b6b, // red
            0x4ecdc4, // turquoise
            0xffe66d, // yellow
            0xa8e6cf, // mint
            0xff8b94, // pink
            0xc7ceea, // lavender
            0xffd93d, // gold
            0x95e1d3, // seafoam
            0xf38181, // coral
            0xaa96da  // purple
        ];

        // Initialize Three.js
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87ceeb, 10, 50);

            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const hemisphereLight = new THREE.HemisphereLight(0x87ceeb, 0xc2b280, 0.5);
            scene.add(hemisphereLight);

            createBeach();
            createStones();
            initMouseControls();

            window.addEventListener('resize', onWindowResize);
        }

        function initMouseControls() {
            // Mouse move event
            window.addEventListener('mousemove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            });

            // Mouse down event
            window.addEventListener('mousedown', () => {
                mousePressed = true;
            });

            // Mouse up event
            window.addEventListener('mouseup', () => {
                mousePressed = false;
            });

            // Pointer lock for particle control (optional enhancement)
            renderer.domElement.addEventListener('click', () => {
                if (currentState === GameState.STORY) {
                    // In story mode, track mouse position for particle control
                }
            });
        }

        function createBeach() {
            // Sand with texture image
            const sandGeometry = new THREE.PlaneGeometry(100, 100);
            const textureLoader = new THREE.TextureLoader();
            const sandTexture = textureLoader.load('e04a813c-4be4-4934-b612-ee05f5cdc3c3.jpeg');
            sandTexture.wrapS = THREE.RepeatWrapping;
            sandTexture.wrapT = THREE.RepeatWrapping;
            sandTexture.repeat.set(10, 10);

            const sandMaterial = new THREE.MeshStandardMaterial({
                map: sandTexture,
                color: 0xAAAAAA, // 67% brightness
                roughness: 0.9,
                metalness: 0.1
            });
            const sand = new THREE.Mesh(sandGeometry, sandMaterial);
            sand.rotation.x = -Math.PI / 2;
            sand.receiveShadow = true;
            scene.add(sand);

            // Ocean
            const oceanGeometry = new THREE.PlaneGeometry(100, 50);
            const oceanMaterial = new THREE.MeshStandardMaterial({
                color: 0x006994,
                roughness: 0.3,
                metalness: 0.3
            });
            const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.z = -30;
            ocean.position.y = -0.1;
            scene.add(ocean);

            // Sky
            scene.background = new THREE.Color(0x87ceeb);
        }

        function createStones() {
            const positions = [
                [-6, 0, 2], [-3, 0, 1], [0, 0, 0], [3, 0, 1], [6, 0, 2],
                [-5, 0, 5], [-1.5, 0, 6], [2, 0, 5.5], [5, 0, 6], [0, 0, 8]
            ];

            const textureLoader = new THREE.TextureLoader();

            positions.forEach((pos, index) => {
                let stone;

                if (index === 0) {
                    // First stone uses the heart texture image
                    const heartTexture = textureLoader.load('爱心石头1.png');

                    // Create a plane geometry for the image (larger size)
                    const geometry = new THREE.PlaneGeometry(2.0, 2.0);
                    const material = new THREE.MeshStandardMaterial({
                        map: heartTexture,
                        transparent: true,
                        alphaTest: 0.1,
                        side: THREE.DoubleSide,
                        color: 0xDDDDDD, // Brighter than sand (87%)
                        roughness: 0.6,
                        metalness: 0.1,
                        emissive: stoneColors[index],
                        emissiveIntensity: 0
                    });

                    stone = new THREE.Mesh(geometry, material);
                    stone.rotation.x = -Math.PI / 2; // Lay flat on ground
                } else {
                    // Other stones use geometric shapes (larger size)
                    const geometry = new THREE.DodecahedronGeometry(0.8 + Math.random() * 0.4, 0);
                    const material = new THREE.MeshStandardMaterial({
                        color: stoneColors[index],
                        roughness: 0.7,
                        metalness: 0.2,
                        emissive: stoneColors[index],
                        emissiveIntensity: 0
                    });

                    stone = new THREE.Mesh(geometry, material);
                }

                stone.position.set(pos[0], 0.1, pos[2]); // Lower to ground level
                stone.castShadow = true;
                stone.receiveShadow = true;
                stone.userData.color = stoneColors[index];
                stone.userData.index = index;
                stone.userData.originalY = stone.position.y;

                scene.add(stone);
                stones.push(stone);
            });
        }

        function createParticleSystem(color) {
            const particleCount = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);

            const colorObj = new THREE.Color(color);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                // Initial sphere distribution
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const radius = 2 + Math.random() * 2;

                positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = radius * Math.cos(phi);

                colors[i3] = colorObj.r + Math.random() * 0.2 - 0.1;
                colors[i3 + 1] = colorObj.g + Math.random() * 0.2 - 0.1;
                colors[i3 + 2] = colorObj.b + Math.random() * 0.2 - 0.1;

                sizes[i] = Math.random() * 0.1 + 0.05;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            particles.userData.basePositions = positions.slice();
            particles.userData.scale = 1.0;
            scene.add(particles);
        }

        function updateParticles(expansionAmount) {
            if (!particles) return;

            const positions = particles.geometry.attributes.position.array;
            const basePositions = particles.userData.basePositions;
            const scale = 1.0 + expansionAmount * 4; // Scale from 1 to 5

            for (let i = 0; i < positions.length; i += 3) {
                positions[i] = basePositions[i] * scale;
                positions[i + 1] = basePositions[i + 1] * scale;
                positions[i + 2] = basePositions[i + 2] * scale;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.userData.scale = scale;

            // Rotation
            particles.rotation.y += 0.002;
        }

        function selectStone(stone) {
            selectedStone = stone;
            cameraAnimating = true;

            // Animate camera to stone
            const targetPos = {
                x: stone.position.x,
                y: stone.position.y + 2,
                z: stone.position.z + 5
            };

            const cameraPos = { ...camera.position };
            const lookAtPos = { x: 0, y: 0, z: 0 };
            const targetLookAt = { ...stone.position };

            // Camera position tween
            new TWEEN.Tween(cameraPos)
                .to(targetPos, 1500)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => {
                    camera.position.set(cameraPos.x, cameraPos.y, cameraPos.z);
                })
                .start();

            // Camera look-at tween
            new TWEEN.Tween(lookAtPos)
                .to(targetLookAt, 1500)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => {
                    camera.lookAt(lookAtPos.x, lookAtPos.y, lookAtPos.z);
                })
                .onComplete(() => {
                    cameraAnimating = false;

                    // Start darkening and glow effect
                    setTimeout(() => {
                        // Gradually darken background
                        const bgColor = { r: 0x87 / 255, g: 0xce / 255, b: 0xeb / 255 };
                        const targetColor = { r: 0x1a / 255, g: 0x1a / 255, b: 0x2e / 255 };

                        new TWEEN.Tween(bgColor)
                            .to(targetColor, 1000)
                            .onUpdate(() => {
                                const color = new THREE.Color(bgColor.r, bgColor.g, bgColor.b);
                                scene.fog.color.copy(color);
                                scene.background.copy(color);
                            })
                            .start();

                        // Glow effect
                        const glowIntensity = { value: 0 };
                        new TWEEN.Tween(glowIntensity)
                            .to({ value: 1.0 }, 1000)
                            .onUpdate(() => {
                                stone.material.emissiveIntensity = glowIntensity.value;
                            })
                            .start();

                        // Hide other stones
                        stones.forEach(s => {
                            if (s !== stone) {
                                const opacity = { value: 1 };
                                new TWEEN.Tween(opacity)
                                    .to({ value: 0 }, 800)
                                    .onUpdate(() => {
                                        s.material.opacity = opacity.value;
                                        s.material.transparent = true;
                                    })
                                    .onComplete(() => {
                                        s.visible = false;
                                    })
                                    .start();
                            }
                        });

                        // Transition to story mode
                        setTimeout(() => {
                            currentState = GameState.STORY;
                            stone.visible = false;

                            // Check if it's the heart stone (index 0)
                            if (stone.userData.index === 0) {
                                // Play wedding video for heart stone
                                playWeddingVideo();
                            } else {
                                // Show particle system for other stones
                                createParticleSystem(stone.userData.color);
                                document.getElementById('hint').textContent = 'Hold mouse button and keep for 5 seconds';
                                document.getElementById('hint').style.display = 'block';
                                document.getElementById('timer').style.display = 'block';
                            }
                        }, 1500);
                    }, 300);
                })
                .start();

            document.getElementById('hint').textContent = 'Entering the stone\'s story...';
        }

        function returnToBeach() {
            currentState = GameState.BEACH;
            expansionTimer = 0;
            isExpanding = false;

            // Remove particles
            if (particles) {
                scene.remove(particles);
                particles.geometry.dispose();
                particles.material.dispose();
                particles = null;
            }

            // Animate camera back to original position
            const cameraPos = { ...camera.position };
            new TWEEN.Tween(cameraPos)
                .to(originalCameraPosition, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => {
                    camera.position.set(cameraPos.x, cameraPos.y, cameraPos.z);
                })
                .start();

            const lookAtPos = { x: selectedStone.position.x, y: selectedStone.position.y, z: selectedStone.position.z };
            new TWEEN.Tween(lookAtPos)
                .to(originalCameraTarget, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => {
                    camera.lookAt(lookAtPos.x, lookAtPos.y, lookAtPos.z);
                })
                .start();

            // Restore scene colors
            const bgColor = { r: 0x1a / 255, g: 0x1a / 255, b: 0x2e / 255 };
            const targetColor = { r: 0x87 / 255, g: 0xce / 255, b: 0xeb / 255 };

            new TWEEN.Tween(bgColor)
                .to(targetColor, 1500)
                .onUpdate(() => {
                    const color = new THREE.Color(bgColor.r, bgColor.g, bgColor.b);
                    scene.fog.color.copy(color);
                    scene.background.copy(color);
                })
                .start();

            // Show all stones
            stones.forEach(stone => {
                stone.visible = true;
                stone.material.emissiveIntensity = 0;
                stone.material.opacity = 1;
                stone.material.transparent = false;
            });

            selectedStone = null;
            hoveredStone = null;
            hoverTimer = 0;

            document.getElementById('hint').textContent = 'Hover your mouse over a stone for 2 seconds to select it';
            document.getElementById('timer').style.display = 'none';
        }

        // Initialize game ready state
        function initGameReady() {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('instructions').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('instructions').style.display = 'none';
                    document.getElementById('hint').textContent = 'Hover your mouse over a stone for 2 seconds to select it';
                    document.getElementById('hint').style.display = 'block';
                }, 500);
            }, 1000);

            // Setup video close button
            document.getElementById('close-video').addEventListener('click', closeWeddingVideo);

            // Auto close when video ends
            document.getElementById('video-player').addEventListener('ended', closeWeddingVideo);
        }

        function playWeddingVideo() {
            const videoContainer = document.getElementById('wedding-video');
            const videoPlayer = document.getElementById('video-player');

            videoContainer.style.display = 'block';
            videoPlayer.currentTime = 0;
            videoPlayer.play();

            document.getElementById('hint').style.display = 'none';
        }

        function closeWeddingVideo() {
            const videoContainer = document.getElementById('wedding-video');
            const videoPlayer = document.getElementById('video-player');

            videoPlayer.pause();
            videoContainer.style.display = 'none';

            // Return to beach
            returnToBeach();
        }

        function processMouseInput() {
            if (currentState === GameState.BEACH && !selectedStone) {
                // Use raycaster to detect stone under mouse
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(stones);

                let currentHoveredStone = null;

                if (intersects.length > 0) {
                    currentHoveredStone = intersects[0].object;
                }

                // Reset all stones first
                stones.forEach(stone => {
                    if (stone !== currentHoveredStone) {
                        stone.material.emissiveIntensity = 0;
                        stone.position.y = stone.userData.originalY;
                    }
                });

                // Update hover timer
                if (currentHoveredStone) {
                    if (hoveredStone === currentHoveredStone) {
                        hoverTimer += 1/60; // Increment by frame time (assuming 60 FPS)

                        // Visual feedback
                        currentHoveredStone.material.emissiveIntensity = 0.3 + (hoverTimer / hoverDuration) * 0.4;
                        currentHoveredStone.position.y = currentHoveredStone.userData.originalY + Math.sin(Date.now() * 0.003) * 0.1;

                        // Update hint with progress
                        const remaining = Math.max(0, hoverDuration - hoverTimer);
                        document.getElementById('hint').textContent =
                            `Hold for ${remaining.toFixed(1)}s to select this stone`;

                        if (hoverTimer >= hoverDuration) {
                            selectStone(currentHoveredStone);
                            hoverTimer = 0;
                        }
                    } else {
                        // Different stone, reset timer
                        hoveredStone = currentHoveredStone;
                        hoverTimer = 0;
                    }
                } else {
                    // No stone hovered, reset
                    hoveredStone = null;
                    hoverTimer = 0;
                    document.getElementById('hint').textContent =
                        'Hover your mouse over a stone for 2 seconds to select it';
                }
            } else if (currentState === GameState.STORY) {
                // Mouse control for particle expansion
                // Hold mouse button to expand
                if (mousePressed && !isExpanding) {
                    isExpanding = true;
                }

                if (!mousePressed && isExpanding) {
                    isExpanding = false;
                    expansionTimer = 0;
                }

                if (isExpanding) {
                    expansionTimer += 1/60; // Assuming 60 FPS

                    if (expansionTimer >= targetExpansionTime) {
                        returnToBeach();
                        return;
                    }

                    document.getElementById('timer').textContent =
                        `${(targetExpansionTime - expansionTimer).toFixed(1)}s`;
                } else {
                    expansionTimer = Math.max(0, expansionTimer - 1/60);
                    document.getElementById('timer').textContent =
                        `${(targetExpansionTime - expansionTimer).toFixed(1)}s`;
                }

                // Update particles based on mouse press (0 or 1)
                const expansionAmount = mousePressed ? 1.0 : 0.0;
                updateParticles(expansionAmount);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update TWEEN animations
            TWEEN.update();

            // Process mouse input
            processMouseInput();

            // Stones remain static (no rotation)

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initThree();
            initGameReady();
            animate();
        });
    </script>
</body>
</html>
